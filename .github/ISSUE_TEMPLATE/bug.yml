name: Bug report
description: Report a reproducible problem in Syll.
title: "bug: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Syll version
      description: Run `syll --version` or check your installed package version.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 14.5, Ubuntu 24.04, Windows 11"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.11.9"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest sequence that triggers the problem.
      placeholder: |
        1. Run `syll wake`
        2. Open the Pet tab
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove API keys, tokens, local paths, or private chat content before posting.
      render: text
    validations:
      required: false
