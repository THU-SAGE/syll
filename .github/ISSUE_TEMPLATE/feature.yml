name: Feature request
description: Propose a user-facing improvement.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem or workflow gap should Syll solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workaround or smaller design did you consider?
    validations:
      required: false
  - type: dropdown
    id: pr
    attributes:
      label: Would you like to open a PR?
      options:
        - "Yes"
        - "Maybe"
        - "No"
    validations:
      required: true
