name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  classify:
    if: github.repository == 'THU-SAGE/syll' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re

          version = os.environ["TAG"].removeprefix("v")
          prerelease = bool(re.search(r"(?:a|b|rc)\d+$", version))
          print(f"prerelease={str(prerelease).lower()}")
          PY

  build:
    if: github.repository == 'THU-SAGE/syll' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]" build twine
      - name: Ruff
        run: ruff check syll/ tests/
      - name: Pytest
        run: pytest tests/ -v
      - name: Build
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish-testpypi:
    needs: [classify, build]
    if: needs.classify.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/syll
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: [classify, build]
    if: needs.classify.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/syll
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
